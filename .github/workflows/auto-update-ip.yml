name: Auto Update IP Lists

on:
  schedule:
    # 国际标准时间 UTC 16:00 等于 北京时间次日 02:00
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 显式赋予写入权限

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Update Script
      run: python py/update_ip.py

    - name: Check for Changes
      id: git-check
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "No changes detected."
        fi

    - name: Commit and Push Changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add IPv4/ IPv6/
        git commit -m "Auto-updated IP lists: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
        git push

    - name: Set Environment Variables
      if: steps.git-check.outputs.changes == 'true'
      id: vars
      run: |
        echo "TAG_NAME=IP-Build-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
        echo "RELEASE_TIME=$(date -u +'%Y-%m-%d %H:%M:%S') UTC" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: steps.git-check.outputs.changes == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.vars.outputs.TAG_NAME }}
        name: "IP Lists Update ${{ steps.vars.outputs.TAG_NAME }}"
        body: |
          ### 📢 数据源声明
          本仓库数据每日全量同步自公共数据源：[ispip.clang.cn](https://ispip.clang.cn/)
          
          ### 📅 自动更新日志
          - 更新时间: ${{ steps.vars.outputs.RELEASE_TIME }}
          
          ### 📋 下载前识别指南（文件与运营商对照表）
          为了方便您在下载前快速识别，请参考以下对应关系：
          
          | 运营商/区域描述 | IPv4 文件名 (`.txt` / `.rsc`) | IPv6 文件名 (`.txt` / `.rsc`) | 内部 List 名称 |
          | :--- | :--- | :--- | :--- |
          | 🇨🇳 **中国大陆全网** | `List_ALL_China` | `List_ALL_China_ipv6` | `List_ALL_China` |
          | ⚡ **中国电信** | `List_ALL_ChinaTelecom` | `List_ALL_ChinaTelecom_ipv6` | `List_ALL_ChinaTelecom` |
          | 🌀 **中国联通** | `List_ALL_ChinaUnicom` | `List_ALL_ChinaUnicom_ipv6` | `List_ALL_ChinaUnicom` |
          | Ⓜ️ **中国移动** | `List_ALL_ChinaMobile` | `List_ALL_ChinaMobile_ipv6` | `List_ALL_ChinaMobile` |
          | 📡 **中国广电** | `List_ALL_ChinaBtn` | `List_ALL_ChinaBtn_ipv6` | `List_ALL_ChinaBtn` |
          | 🎓 **中国教育网** | `List_ALL_ChinaCernet` | `List_ALL_ChinaCernet_ipv6` | `List_ALL_ChinaCernet` |
          | 🌐 **鹏博士/长宽** | `List_ALL_ChinaGwbn` | `List_ALL_ChinaGwbn_ipv6` | `List_ALL_ChinaGwbn` |
          | ➕ **其他ISP** | `List_Other_China` | `List_Other_China_ipv6` | `List_Other_China` |
          | 🇭🇰 **中国香港** | `List_ALL_HK` | `List_ALL_HK_ipv6` | `List_ALL_HK` |
          | 🇲🇴 **中国澳门** | `List_ALL_MO` | `List_ALL_MO_ipv6` | `List_ALL_MO` |
          | 🇹🇼 **中国台湾** | `List_ALL_TW` | `List_ALL_TW_ipv6` | `List_ALL_TW` |
          
          *注：IPv6 文件名带 `_ipv6` 仅用于下载时方便您肉眼区分，导入 RouterOS 后内部生成的 Address List 名称与 IPv4 完全一致，方便防火墙规则统一调用。*
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
        files: |
          IPv4/txt/*.txt
          IPv4/rsc/*.rsc
          IPv6/txt/*.txt
          IPv6/rsc/*.rsc
